name: Smoke guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Run static guard
        run: node scripts/static-guard.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          echo $! > server.pid
          python3 - <<'PY'
          import time
          import urllib.request

          for _ in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1).read()
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('Local test server did not start')
          PY

      - name: Run browser smoke test
        env:
          SMOKE_URL: http://127.0.0.1:4173/
        run: node scripts/browser-smoke.mjs
