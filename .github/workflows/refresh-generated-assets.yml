name: Refresh generated assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-generated-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache offline translation models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/argos-translate
            ~/.local/share/argos-translate
            ~/.cache/huggingface
          key: offline-translation-v1-${{ runner.os }}-${{ hashFiles('scripts/translate_headlines_offline.py') }}
          restore-keys: |
            offline-translation-v1-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install eccodes numpy pillow
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install argostranslate==1.11.0 transformers==4.57.6

      - name: Refresh Earth texture
        run: python scripts/update_earth_live_texture.py

      - name: Build self-hosted world geometry
        run: node scripts/build_world_geometry.mjs

      - name: Refresh NOAA weather grid
        run: python scripts/update_noaa_weather_grid.py

      - name: Refresh weather rasters
        run: python scripts/build_weather_rasters.py

      - name: Refresh population data
        run: python scripts/update_population_only.py

      - name: Refresh headlines
        run: |
          python scripts/update_headlines_only.py
          python scripts/translate_headlines_offline.py

      - name: Validate generated assets
        run: |
          python -m json.tool earth-live.json > /dev/null
          python -m json.tool world-geometry.json > /dev/null
          python -m json.tool noaa-weather-grid.json > /dev/null
          python -m json.tool weather-rasters.json > /dev/null
          python -m json.tool world-data.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          required_files = [
              "earth-live.jpg",
              "earth-live.json",
              "world-geometry.json",
              "noaa-weather-grid.json",
              "weather-temp.png",
              "weather-precip.png",
              "weather-rasters.json",
              "world-data.json",
          ]
          missing = [path for path in required_files if not Path(path).is_file()]
          empty = [path for path in required_files if Path(path).is_file() and Path(path).stat().st_size == 0]
          if missing:
              raise SystemExit(f"missing generated files: {', '.join(missing)}")
          if empty:
              raise SystemExit(f"empty generated files: {', '.join(empty)}")

          weather = json.loads(Path("noaa-weather-grid.json").read_text(encoding="utf-8"))
          points = weather.get("grid", [])
          if len(points) < 100:
              raise SystemExit(f"expected at least 100 NOAA grid points, found {len(points)}")

          rows = json.loads(Path("world-data.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list):
              raise SystemExit("world-data.json must be a list")
          if len(rows) < 200:
              raise SystemExit(f"expected at least 200 country rows, found {len(rows)}")
          headline_count = sum(1 for row in rows if row.get("headline"))
          headline_url_count = sum(1 for row in rows if row.get("headlineUrl"))
          english_count = sum(
              1
              for row in rows
              if row.get("headline")
              and row.get("englishHeadline")
              and row.get("englishHeadline") != "English translation unavailable"
          )
          unavailable_count = sum(
              1
              for row in rows
              if row.get("headline")
              and row.get("englishHeadline") == "English translation unavailable"
          )
          if headline_url_count < 180:
              raise SystemExit(f"expected at least 180 headline URLs, found {headline_url_count}")
          if english_count < 180:
              raise SystemExit(f"expected at least 180 English headline values, found {english_count}")
          # Some countries currently have only sports or unsupported-language
          # results after the general-news filter. Keep that honest rather than
          # publishing sports just to reach full coverage.
          if unavailable_count > 10:
              raise SystemExit(f"found {unavailable_count} headlines without an offline English translation")
          from scripts.translate_headlines_offline import translation_quality_reason
          quality_failures = [
              row.get("iso2", "?")
              for row in rows
              if row.get("headline")
              and row.get("englishHeadline")
              and row.get("englishHeadline") != "English translation unavailable"
              and translation_quality_reason(row["englishHeadline"], row["headline"])
          ]
          if quality_failures:
              raise SystemExit(f"malformed English translations: {', '.join(quality_failures)}")
          print(f"Validated {len(rows)} country rows, {headline_count} headlines, {headline_url_count} URLs, {english_count} English values, and {len(points)} NOAA grid points")
          PY

      - name: Run application guards
        run: |
          python -m py_compile scripts/build_world_data.py scripts/update_headlines_only.py scripts/translate_headlines_offline.py scripts/translation-quality-smoke.py scripts/headline-selection-smoke.py
          python scripts/translation-quality-smoke.py
          python scripts/headline-selection-smoke.py
          npm run check:syntax
          npm run check:static

      - name: Commit refreshed assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh generated assets"
          file_pattern: earth-live.jpg earth-live.json world-geometry.json noaa-weather-grid.json weather-temp.png weather-precip.png weather-rasters.json world-data.json
