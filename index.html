<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="World" />
    <title>World — live globe & country briefing</title>
    <meta
      name="description"
      content="World is a browser-based live globe with weather, celestial context, searchable country briefings, and translated summaries."
    />
    <meta name="theme-color" content="#03070d" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://ancientpagoda-rgb.github.io/world/" />
    <meta property="og:title" content="World — live globe & country briefing" />
    <meta property="og:description" content="Explore a live Earth globe, weather context, and searchable country briefings." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ancientpagoda-rgb.github.io/world/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./globe-shell.css" />
  </head>
  <body>
    <canvas id="starfield-canvas" class="starfield-canvas" aria-hidden="true"></canvas>
    <div id="build-tag" class="build-tag"></div>

    <main>
      <section class="world-visual-stage" aria-label="Interactive live Earth globe">
        <canvas
          id="weather-orb-canvas"
          class="weather-orb-canvas"
          width="960"
          height="960"
          aria-label="Interactive Earth with live weather and celestial context"
        ></canvas>
      </section>

      <section class="country-list-section" aria-label="Country briefings">
        <div id="country-list" class="country-list"></div>
      </section>
    </main>

    <script>
      (async () => {
        window.__worldDeferAppStart = true;
        const searchParams = new URLSearchParams(location.search);
        window.__worldGlobeBordersEnabled = () => searchParams.get("borders") === "1";
        if (searchParams.get("debug") === "1") document.body.classList.add("debug-mode");

        const appV = String(Date.now());
        const tag = document.getElementById("build-tag");
        const reportLoadError = (message) => {
          if (tag) tag.textContent += `\nERROR: ${message}`;
          console.error(message);
        };
        const bootGlobe = () => {
          try {
            if (window.__worldGlobeBooted) return;
            if (typeof window.initializeWeatherOrb !== "function") throw new Error("Globe renderer bootstrap is unavailable");
            window.__worldGlobeBooted = true;
            window.initializeWeatherOrb();
          } catch (error) {
            const message = error?.stack || error?.message || String(error);
            if (tag) tag.textContent += `\nERROR: ${message}`;
            console.error(error);
          }
        };
        const loadGlobePatch = () => {
          const patch = document.createElement("script");
          patch.src = `./globe-runtime-fix.js?v=${encodeURIComponent(appV)}`;
          patch.onload = bootGlobe;
          patch.onerror = () => { reportLoadError("Failed to load globe-runtime-fix.js; using base renderer"); bootGlobe(); };
          document.body.appendChild(patch);
        };
        const loadWordPairPatch = () => {
          const patch = document.createElement("script");
          patch.src = `./word-pair-alignment.js?v=${encodeURIComponent(appV)}`;
          const startAppAndGlobe = () => {
            if (typeof window.startWorldApp === "function") window.startWorldApp();
            else reportLoadError("World application bootstrap is unavailable");
            loadGlobePatch();
          };
          patch.onload = startAppAndGlobe;
          patch.onerror = () => { reportLoadError("Failed to load word-pair-alignment.js; using independent word colors"); startAppAndGlobe(); };
          document.body.appendChild(patch);
        };
        const waitForLanguageAwareIpa = () => {
          const deadline = Date.now() + 5000;
          const poll = () => {
            if (typeof window.__worldLanguageAwareIpaDiagnostics === "function") {
              loadWordPairPatch();
              return;
            }
            if (Date.now() >= deadline) {
              console.warn("Language-aware IPA did not become ready before timeout; pairing broad IPA instead.");
              loadWordPairPatch();
              return;
            }
            setTimeout(poll, 20);
          };
          poll();
        };
        const loadIpaPatch = () => {
          const patch = document.createElement("script");
          patch.src = `./ipa-phonetics.js?v=${encodeURIComponent(appV)}`;
          patch.onload = waitForLanguageAwareIpa;
          patch.onerror = () => { reportLoadError("Failed to load ipa-phonetics.js; using fallback phonetics"); loadWordPairPatch(); };
          document.body.appendChild(patch);
        };
        const loadSyllableColorPatch = () => {
          const patch = document.createElement("script");
          patch.src = `./syllable-color-fix.js?v=${encodeURIComponent(appV)}`;
          patch.onload = loadIpaPatch;
          patch.onerror = () => { reportLoadError("Failed to load syllable-color-fix.js; using uncolored IPA"); loadIpaPatch(); };
          document.body.appendChild(patch);
        };
        const loadTranslationFinalizer = () => {
          const patch = document.createElement("script");
          patch.src = `./translation-runtime-finalize.js?v=${encodeURIComponent(appV)}`;
          patch.onload = loadSyllableColorPatch;
          patch.onerror = () => { reportLoadError("Failed to load translation-runtime-finalize.js; using upgraded base phonetics"); loadSyllableColorPatch(); };
          document.body.appendChild(patch);
        };
        const loadTranslationPatch = () => {
          const patch = document.createElement("script");
          patch.src = `./translation-runtime-fix.js?v=${encodeURIComponent(appV)}`;
          patch.onload = loadTranslationFinalizer;
          patch.onerror = () => { reportLoadError("Failed to load translation-runtime-fix.js; using base translations"); loadSyllableColorPatch(); };
          document.body.appendChild(patch);
        };

        const app = document.createElement("script");
        app.src = `./app.js?v=${encodeURIComponent(appV)}`;
        app.onerror = () => reportLoadError("Failed to load app.js");
        app.onload = loadTranslationPatch;
        document.body.appendChild(app);

        if (tag) tag.textContent = `World v1.1.0\napp ${appV}\nagent: connected`;

      })();
    </script>
  </body>
</html>
