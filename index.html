<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World — live globe & country briefing</title>
    <meta
      name="description"
      content="World is a browser-based live globe with weather, celestial context, searchable country briefings, and translated summaries."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./globe-shell.css" />
  </head>
  <body>
    <canvas id="starfield-canvas" class="starfield-canvas" aria-hidden="true"></canvas>
    <div id="build-tag" class="build-tag"></div>
    <button
      id="rasters-toggle"
      class="rasters-toggle"
      type="button"
      aria-label="Toggle raster weather overlays"
      aria-pressed="false"
    >Rasters: Off</button>

    <main>
      <section class="world-visual-stage" aria-label="Interactive live Earth globe">
        <canvas
          id="weather-orb-canvas"
          class="weather-orb-canvas"
          width="960"
          height="960"
          aria-label="Interactive Earth with live weather and celestial context"
        ></canvas>
      </section>

      <section class="country-list-section" aria-labelledby="country-list-heading">
        <h2 id="country-list-heading" class="sr-only">Country briefing list</h2>
        <div id="country-list" class="country-list"></div>
      </section>
    </main>

    <script>
      (async () => {
        const searchParams = new URLSearchParams(location.search);
        if (searchParams.get("debug") === "1") {
          document.body.classList.add("debug-mode");
        }

        const appV = String(Date.now());
        const tag = document.getElementById("build-tag");

        const reportLoadError = (message) => {
          if (tag) tag.textContent += `\nERROR: ${message}`;
          console.error(message);
        };

        const bootGlobe = () => {
          try {
            if (window.__worldGlobeBooted) return;
            if (typeof window.initializeWeatherOrb !== "function") {
              throw new Error("Globe renderer bootstrap is unavailable");
            }
            window.__worldGlobeBooted = true;
            window.initializeWeatherOrb();
          } catch (error) {
            const message = error?.stack || error?.message || String(error);
            if (tag) tag.textContent += `\nERROR: ${message}`;
            console.error(error);
          }
        };

        const loadGlobePatch = () => {
          const patch = document.createElement("script");
          patch.src = `./globe-runtime-fix.js?v=${encodeURIComponent(appV)}`;
          patch.onload = bootGlobe;
          patch.onerror = () => {
            reportLoadError("Failed to load globe-runtime-fix.js; using base renderer");
            bootGlobe();
          };
          document.body.appendChild(patch);
        };

        const loadTranslationPatch = () => {
          const patch = document.createElement("script");
          patch.src = `./translation-runtime-fix.js?v=${encodeURIComponent(appV)}`;
          patch.onload = loadGlobePatch;
          patch.onerror = () => {
            reportLoadError("Failed to load translation-runtime-fix.js; using base translations");
            loadGlobePatch();
          };
          document.body.appendChild(patch);
        };

        const app = document.createElement("script");
        app.src = `./app.js?v=${encodeURIComponent(appV)}`;
        app.onerror = () => reportLoadError("Failed to load app.js");
        app.onload = loadTranslationPatch;
        document.body.appendChild(app);

        if (tag) tag.textContent = `World v1.0.11\napp ${appV}\nagent: connected`;

        const toggle = document.getElementById("rasters-toggle");
        const rastersOn = () => searchParams.get("rasters") === "1";
        const setToggleState = () => {
          if (!toggle) return;
          const enabled = rastersOn();
          toggle.textContent = `Rasters: ${enabled ? "On" : "Off"}`;
          toggle.setAttribute("aria-pressed", enabled ? "true" : "false");
        };

        if (toggle) {
          setToggleState();
          toggle.addEventListener("click", () => {
            if (rastersOn()) searchParams.delete("rasters");
            else searchParams.set("rasters", "1");

            const nextUrl = new URL(location.href);
            nextUrl.search = searchParams.toString();
            history.replaceState(null, "", nextUrl);
            setToggleState();
          });
        }
      })();
    </script>
  </body>
</html>
