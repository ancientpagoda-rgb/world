<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World — country briefing</title>
    <meta
      name="description"
      content="World is a browser-based country briefing surface with searchable headlines, translated summaries, and navigation controls."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="build-tag" class="build-tag"></div>
    <main>
      <header class="hero">
        <div>
          <p class="eyebrow">World briefing</p>
          <h1>World</h1>
          <p class="lede">
            Search a live country briefing list with headlines, translated snippets, and country shortcuts.
            The globe is gone. The page is now about the list.
          </p>
        </div>
      </header>

      <section class="world-controls" aria-label="World list controls">
        <div class="control-panel">
          <div class="control-field">
            <label for="country-filter" class="sr-only">Filter</label>
            <input
              id="country-filter"
              type="search"
              inputmode="search"
              autocomplete="off"
              aria-label="Filter"
            />
          </div>

          <div class="control-field">
            <label for="country-jump" class="sr-only">Select</label>
            <select id="country-jump">
              <option value=""></option>
            </select>
          </div>

          <p id="country-summary" class="country-summary" aria-live="polite" hidden></p>
        </div>
      </section>

      <section class="country-list-section" aria-labelledby="country-list-heading">
        <h2 id="country-list-heading" class="sr-only">Country briefing list</h2>
        <div id="country-list" class="country-list"></div>
      </section>
    </main>

    <script>
      (async () => {
        const searchParams = new URLSearchParams(location.search);
        if (searchParams.get("debug") === "1") {
          document.body.classList.add("debug-mode");
        }

        // app.js changes more frequently than the static data; always bust it.
        const appV = String(Date.now());
        const s = document.createElement("script");
        s.src = `./app.js?v=${encodeURIComponent(appV)}`;
        s.onerror = () => {
          const tag = document.getElementById("build-tag");
          if (tag) tag.textContent += "\nERROR: Failed to load app.js";
          console.error("Failed to load app.js");
        };
        document.body.appendChild(s);

        const tag = document.getElementById("build-tag");
        if (tag) tag.textContent = `World v1.0.7\napp ${appV}\nagent: connected`;

      })();
    </script>
  </body>
</html>
